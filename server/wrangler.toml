# Cloudflare Workers deployment (free tier: 100k requests/day).
# Deploy: cd server && npx wrangler deploy
# Secrets: npx wrangler secret put FOOTBALL_DATA_API_KEY   (etc.)
name = "footiq-api"
main = "src/worker.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Sync jobs (standings, fixtures, AI cache warm) — every 30 minutes.
#
# Do not tighten this without doing the arithmetic: the football-data.org free
# tier allows 10 requests/minute, and a full pass costs 2 requests per
# configured competition (standings + fixtures), serialized ~7s apart. Six
# competitions ≈ 90s of wall clock. Live scores stay fresh via the 30s
# Cache-Control on /api/matches, not via a faster cron.
[triggers]
crons = ["*/30 * * * *"]

# REQUIRED for a working deployment (despite being commented out by default).
#
# The cron handler and the fetch handler do not share an isolate, so an
# in-memory cache means the snapshot a sync writes is invisible to the requests
# that need it — /api/matches would answer "unsynced" forever. Persist the
# snapshot in KV (below) or in Supabase (SUPABASE_SERVICE_ROLE_KEY + the
# catalog_snapshots table). One of the two is not optional.
#
#   wrangler kv namespace create CACHE   # then paste the id here
# [[kv_namespaces]]
# binding = "CACHE"
# id = "..."

[vars]
NODE_ENV = "production"
CORS_ORIGINS = "https://footiq-omega.vercel.app,http://localhost:5173"
SUPABASE_URL = "https://zcemnioniooyyhpjpwbn.supabase.co"
# Gemini's free tier, not Anthropic: no card. Free quotas are per project PER
# MODEL and gemini-3.8-flash allows only 20 requests/day (the 429s of Sept
# 2026), so AI_MODEL is a fallback list: Flash-Lite models first (far larger
# daily quotas), full Flash last. A 429 moves to the next model. Check live
# limits at https://aistudio.google.com/rate-limit — Google changes them.
# "gemini" is on the frontend's REAL_PROVIDERS allowlist (lib/ai-provenance.ts),
# so the demo-engine chip goes quiet by itself once GEMINI_API_KEY is set.
AI_PROVIDER = "gemini"
AI_MODEL = "gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-2.5-flash-lite,gemini-3.8-flash"
DATA_PROVIDER = "football-data"
# The six competitions this key's free tier grants. Europa League and
# Conference League are NOT on it — their codes would 403 per competition
# (tolerated and logged, but pointless). Full free-tier set: PL, PD, BL1, SA,
# FL1, CL, ELC, DED, PPL, BSA, EC, WC.
#
# NOTE: do not reintroduce the singular FOOTBALL_DATA_COMPETITION here. It is
# kept as a deprecated alias that WINS when set, so leaving it in place would
# silently pin production back to a single league.
FOOTBALL_DATA_COMPETITIONS = "PL,PD,BL1,SA,FL1,CL"
# Wide enough to span the European off-season: in mid-July the next fixtures
# are five weeks out, and a narrow window makes a healthy sync look broken.
FOOTBALL_DATA_WINDOW_PAST_DAYS = "14"
FOOTBALL_DATA_WINDOW_FUTURE_DAYS = "60"
# Non-secret config only. Secrets go via `wrangler secret put`.
