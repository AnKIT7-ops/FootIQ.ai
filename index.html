<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="FootIQ is the AI intelligence layer for football — match predictions, natural-language scouting, tactical analysis and transfer probabilities, algorithmically generated and clearly marked apart from verified fact."
    />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0e16" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f3ef" />
    <title>FootIQ — AI Football Intelligence</title>
    <!-- absolute URLs below come from VITE_SITE_URL at build time (vite.config.ts): link unfurlers don't run JS -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FootIQ" />
    <meta property="og:title" content="FootIQ — AI Football Intelligence" />
    <meta
      property="og:description"
      content="The AI intelligence layer for football: predictions, scouting, tactics and transfer probabilities — probabilities, not promises."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FootIQ — AI Football Intelligence" />
    <meta
      name="twitter:description"
      content="The AI intelligence layer for football: predictions, scouting, tactics and transfer probabilities."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "FootIQ",
        "url": "%VITE_SITE_URL%/",
        "description": "The AI intelligence layer for football — predictions, scouting, tactics and transfer intelligence."
      }
    </script>

    <!-- Sync (no defer/async) on purpose: sets the theme class before first paint. External so the CSP needs no inline hash. -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
