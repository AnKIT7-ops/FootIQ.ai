name: Deploy API worker

# Vercel redeploys the site on every merge to main; this does the same for the
# Cloudflare Worker, so the site and the API it calls always ship together.
# No path filter on purpose: the worker bundles files from shared/ and the
# site's src/, and a filter that misses one leaves production on stale code —
# the exact bug this workflow exists to remove. A no-op redeploy is harmless.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once, and never cancel one halfway.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      # The server's own install is enough — nothing it imports from shared/
      # or src/ needs the site's packages.
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
